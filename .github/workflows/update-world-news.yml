name: Update WorldLens News

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "world-news-globe/news-updater.py"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fresh RSS news
        run: python world-news-globe/news-updater.py

      - name: Commit updated news
        run: |
          git config user.name "WorldLens News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-news-globe/news.json world-news-globe/news-meta.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git commit -m "chore: update WorldLens news"
          git push
