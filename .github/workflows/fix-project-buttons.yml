name: Fix all project buttons

on:
  push:
    paths:
      - "project-buttons-trigger.txt"
  workflow_dispatch:

jobs:
  fix-buttons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project overlay and buttons
        run: |
          cat >> styles.css <<'EOF'

          /* ===== PROJECT CARDS: BUTTON VISIBILITY FIX ===== */
          .portfolio-grid .portfolio-item .portfolio-image {
              position: relative;
              overflow: hidden;
          }

          .portfolio-grid .portfolio-item .portfolio-overlay {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              min-height: 0;
              padding: 24px 22px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              text-align: center;
              overflow: hidden;
              z-index: 2;
          }

          .portfolio-grid .portfolio-item .portfolio-overlay h3 {
              flex: 0 0 auto;
              margin: 0 0 10px;
              line-height: 1.2;
          }

          .portfolio-grid .portfolio-item .portfolio-overlay p {
              flex: 0 1 auto;
              margin: 0 0 16px;
              max-width: 90%;
              line-height: 1.5;
          }

          .portfolio-grid .portfolio-item .portfolio-overlay .btn {
              flex: 0 0 auto;
              position: relative;
              z-index: 10;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              box-sizing: border-box;
              width: auto;
              min-width: 180px;
              max-width: 90%;
              min-height: 48px;
              height: 48px;
              margin: 2px auto 0;
              padding: 0 26px;
              line-height: 1.2;
              white-space: nowrap;
              overflow: visible;
              opacity: 1;
              visibility: visible;
              transform: none;
          }

          .portfolio-grid .portfolio-item .portfolio-overlay .btn + .btn {
              margin-top: 10px;
          }

          @media (max-width: 600px) {
              .portfolio-grid .portfolio-item .portfolio-overlay {
                  padding: 18px 14px;
              }

              .portfolio-grid .portfolio-item .portfolio-overlay h3 {
                  font-size: 22px;
              }

              .portfolio-grid .portfolio-item .portfolio-overlay p {
                  max-width: 95%;
                  font-size: 14px;
                  margin-bottom: 12px;
              }

              .portfolio-grid .portfolio-item .portfolio-overlay .btn {
                  min-width: 160px;
                  max-width: 95%;
                  min-height: 44px;
                  height: 44px;
                  padding: 0 20px;
                  font-size: 14px;
              }
          }
          EOF

      - name: Remove temporary trigger
        run: rm -f project-buttons-trigger.txt

      - name: Remove old temporary birthday-only workflows
        run: |
          rm -f .github/workflows/fix-happy-birthday-button.yml
          rm -f .github/workflows/fix-happy-birthday-only.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .github/workflows project-buttons-trigger.txt
          git commit -m "Fix visibility and layout of all project buttons" || exit 0
          git push
