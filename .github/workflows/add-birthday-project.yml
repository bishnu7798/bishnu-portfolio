name: Add Happy Birthday project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-birthday-project:
    if: ${{ !contains(github.event.head_commit.message, '[birthday-project-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add project image and card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p images
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/cba00c310cb3ec25209eea6659edf2ee0e3da272" \
            | jq -r '.content' | tr -d '\n' | base64 -d > images/happy-birthday.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'https://bishnu7798.github.io/Happy-Birthday-/' in s:
              print('Birthday project already present')
              raise SystemExit(0)
          card = '''
                <div class="portfolio-item" data-category="web">
                    <div class="portfolio-image">
                        <img src="images/happy-birthday.png" alt="Happy Birthday interactive website">
                        <div class="portfolio-overlay">
                            <h3>Happy Birthday</h3>
                            <p>Interactive birthday experience with an elegant visual design, music and touch-friendly cake interaction.</p>
                            <a href="https://bishnu7798.github.io/Happy-Birthday-/" class="btn" target="_blank" rel="noopener noreferrer">View Project</a>
                        </div>
                    </div>
                </div>
          '''
          marker = '            <div class="portfolio-grid">'
          if marker not in s:
              raise SystemExit('portfolio-grid marker not found')
          s = s.replace(marker, marker + card, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/happy-birthday.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Happy Birthday project [birthday-project-sync]"
          git push
