name: Fix Happy Birthday button only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Birthday-only CSS fix
        shell: bash
        run: |
          cat >> styles.css <<'EOF'

/* ===== HAPPY BIRTHDAY PROJECT ONLY ===== */
.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay {
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px !important;
    padding: 20px !important;
    overflow: hidden !important;
}

.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay h3 {
    margin: 0 !important;
    line-height: 1.15 !important;
    flex: 0 0 auto !important;
}

.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay p {
    margin: 0 !important;
    line-height: 1.35 !important;
    max-width: 95% !important;
    flex: 0 0 auto !important;
}

.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay a.btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    position: relative !important;
    z-index: 999 !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    width: 190px !important;
    height: 48px !important;
    min-height: 48px !important;
    margin: 4px 0 0 !important;
    padding: 0 22px !important;
    line-height: 1 !important;
    white-space: nowrap !important;
    overflow: visible !important;
    box-sizing: border-box !important;
}

.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay a.btn::before,
.portfolio-item:has(img[src*="birthday"]) .portfolio-overlay a.btn::after {
    pointer-events: none !important;
}

@media (max-width: 768px) {
    .portfolio-item:has(img[src*="birthday"]) .portfolio-overlay {
        gap: 8px !important;
        padding: 15px !important;
    }

    .portfolio-item:has(img[src*="birthday"]) .portfolio-overlay p {
        font-size: 13px !important;
        line-height: 1.3 !important;
    }

    .portfolio-item:has(img[src*="birthday"]) .portfolio-overlay a.btn {
        width: 165px !important;
        height: 44px !important;
        min-height: 44px !important;
        font-size: 13px !important;
    }
}
/* ===== END HAPPY BIRTHDAY PROJECT ONLY ===== */
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix Happy Birthday View Project button"
          git push
