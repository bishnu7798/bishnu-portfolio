name: Fix Birthday project image extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-image:
    if: ${{ !contains(github.event.head_commit.message, '[birthday-image-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename JPEG asset and update card
        run: |
          set -e
          if [ -f images/happy-birthday.png ]; then mv images/happy-birthday.png images/happy-birthday.jpg; fi
          sed -i 's/happy-birthday\.png/happy-birthday.jpg/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/happy-birthday.png images/happy-birthday.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Birthday project image extension [birthday-image-fix]"
          git push
