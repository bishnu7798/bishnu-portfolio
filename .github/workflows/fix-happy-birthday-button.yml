name: Fix Happy Birthday button

on:
  push:
    paths:
      - "happy-birthday-button-trigger.txt"
  workflow_dispatch:

jobs:
  fix-button:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix button CSS
        run: |
          cat >> styles.css <<'EOF'

          /* Happy Birthday project - ensure View Project button is fully visible */
          .portfolio-grid > .portfolio-item:first-child .portfolio-overlay {
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              min-height: 100%;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              overflow: hidden;
              padding: 24px 22px;
              text-align: center;
          }

          .portfolio-grid > .portfolio-item:first-child .portfolio-overlay h3 {
              margin-bottom: 12px;
              flex-shrink: 0;
          }

          .portfolio-grid > .portfolio-item:first-child .portfolio-overlay p {
              margin: 0 0 18px;
              flex-shrink: 0;
              max-width: 520px;
          }

          .portfolio-grid > .portfolio-item:first-child .portfolio-overlay .btn {
              position: relative;
              z-index: 10;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              width: auto;
              min-width: 180px;
              height: 46px;
              min-height: 46px;
              margin: 4px auto 0;
              padding: 0 24px;
              line-height: 1;
              white-space: nowrap;
              flex-shrink: 0;
              opacity: 1;
              visibility: visible;
              transform: none;
          }
          EOF

      - name: Commit CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Fix Happy Birthday View Project button visibility" || exit 0
          git push
